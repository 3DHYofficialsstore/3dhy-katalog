<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Produk — 3DHY Official Store</title>

<style>
  :root{
    --brand:#C1272D; --brand-dark:#8E1B20; --ink:#1C1C1C; --bg:#F5F5F3; --line:#E7E4DE; --wa:#22A559; --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  a{ color:inherit; }
  header.site{ background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; }
  .brandrow{ max-width:1120px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:12px 20px; gap:14px; flex-wrap:wrap; }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .brandmark .logo{ width:40px; height:40px; border-radius:8px; overflow:hidden; flex-shrink:0; }
  .brandmark .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brandmark .name{ font-size:16px; font-weight:800; }
  .header-cta{ background:var(--wa); color:#fff; border:none; padding:9px 16px; border-radius:8px; font-weight:700; font-size:13px; text-decoration:none; display:inline-flex; align-items:center; gap:7px; }

  main{ max-width:1120px; margin:0 auto; padding:26px 20px 50px; }

  .toolbar{
    position:sticky; top:65px; background:var(--bg); z-index:20;
    padding:10px 0 16px; display:flex; flex-direction:column; gap:12px;
  }
  .search-box{
    width:100%; padding:12px 16px; border:1.5px solid var(--line); border-radius:10px;
    font-size:14px; background:#fff; outline:none;
  }
  .search-box:focus{ border-color:var(--brand); }
  .cat-scroll{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .cat-pill{
    flex-shrink:0; padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700;
    background:#fff; border:1.5px solid var(--line); cursor:pointer; white-space:nowrap;
  }
  .cat-pill.active{ background:var(--brand); border-color:var(--brand); color:#fff; }

  .result-count{ font-size:12.5px; color:#888; margin:8px 0 14px; }

  .product-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; }
  .pcard{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; }
  .pcard .pthumb{ aspect-ratio:1; background:#f0f0f0; position:relative; overflow:hidden; }
  .pcard .pthumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pcard .pthumb .nav-btn{
    position:absolute; top:50%; transform:translateY(-50%);
    width:32px; height:32px; border-radius:50%; border:none;
    background:rgba(0,0,0,.45); color:#fff; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; z-index:2;
  }
  .pcard .pthumb .nav-prev{ left:8px; }
  .pcard .pthumb .nav-next{ right:8px; }
  .pcard .pthumb .variant-badge{
    position:absolute; bottom:8px; left:8px; background:rgba(0,0,0,.55); color:#fff;
    font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; z-index:2;
  }
  .pcard .pbody{ padding:12px; flex:1; display:flex; flex-direction:column; }
  .pcard .pcat{ font-size:10px; color:var(--brand); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; }
  .pcard .ptitle{ font-size:13px; font-weight:700; line-height:1.3; margin-bottom:8px; min-height:34px; }
  .pcard .pprice{ font-size:16px; font-weight:800; color:var(--brand); margin-bottom:10px; }
  .pcard .btn{ margin-top:auto; display:block; text-align:center; padding:8px; border-radius:8px; font-size:12.5px; font-weight:700; text-decoration:none; background:var(--wa); color:#fff; }

  .empty-state{ text-align:center; padding:60px 20px; color:#888; font-size:14px; }

  footer{ background:var(--ink); color:#c9c9c9; padding:30px 20px; margin-top:40px; font-size:12.5px; text-align:center; }
  footer strong{ color:#fff; }

  @media (max-width: 900px){ .product-grid{ grid-template-columns: repeat(3,1fr); } }
  @media (max-width: 640px){ .product-grid{ grid-template-columns: repeat(2,1fr); } .toolbar{ top:57px; } }
</style>
</head>
<body>

  <header class="site">
    <div class="brandrow">
      <div class="brandmark">
        <div class="logo"><img src="logo.jpg" alt="3DHY logo"></div>
        <div class="name">3DHY Official Store</div>
      </div>
      <a class="header-cta" onclick="fbq('track','Lead')" href="https://wa.me/6281299115928?text=Halo%20Kak%2C%20saya%20mau%20tanya-tanya%20produk%20kaos%203DHY" target="_blank" rel="noopener">💬 Chat Admin</a>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input type="text" class="search-box" id="searchBox" placeholder="Cari produk... (misal: KBF, huruf A, custom)">
      <div class="cat-scroll" id="catScroll"></div>
    </div>

    <div class="result-count" id="resultCount"></div>
    <div class="product-grid" id="productGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">Produk tidak ditemukan. Coba kata kunci lain.</div>
  </main>

  <footer>
    <div><strong>3DHY Official Store</strong> — Kaos custom cotton combed 24s premium</div>
    <div style="margin-top:6px;">WhatsApp: 0812 9911 5928 · 0852 7506 8224</div>
  </footer>

  <script>
    let allProducts = [];
    let activeCategory = 'Semua';
    let variantIndex = {}; // productCode -> current variant index

    function formatRupiah(n){
      return 'Rp' + n.toLocaleString('id-ID');
    }

    function waLink(productName, variantLabel){
      const text = encodeURIComponent(`Halo Kak, saya mau order ${productName} - varian ${variantLabel}`);
      return `https://wa.me/6281299115928?text=${text}`;
    }

    function renderCategories(){
      const cats = ['Semua', ...new Set(allProducts.map(p => p.category))];
      const scroll = document.getElementById('catScroll');
      scroll.innerHTML = cats.map(c =>
        `<button class="cat-pill${c===activeCategory?' active':''}" data-cat="${c}">${c}</button>`
      ).join('');
      scroll.querySelectorAll('.cat-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          renderCategories();
          renderProducts();
        });
      });
    }

    function changeVariant(code, delta, total){
      const current = variantIndex[code] || 0;
      let next = (current + delta + total) % total;
      variantIndex[code] = next;
      renderProducts();
    }

    function renderProducts(){
      const query = document.getElementById('searchBox').value.trim().toLowerCase();
      let filtered = allProducts.filter(p => {
        const matchCat = activeCategory === 'Semua' || p.category === activeCategory;
        const matchQuery = !query || p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query)
          || p.category.toLowerCase().includes(query)
          || p.variants.some(v => v.label.toLowerCase().includes(query));
        return matchCat && matchQuery;
      });

      document.getElementById('resultCount').textContent = `${filtered.length} produk ditemukan`;
      const grid = document.getElementById('productGrid');
      const empty = document.getElementById('emptyState');

      if(filtered.length === 0){
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      grid.innerHTML = filtered.map(p => {
        const idx = variantIndex[p.code] || 0;
        const variant = p.variants[idx];
        const total = p.variants.length;
        return `
        <div class="pcard">
          <div class="pthumb">
            ${total > 1 ? `<button class="nav-btn nav-prev" onclick="changeVariant('${p.code}', -1, ${total})">‹</button>` : ''}
            <img src="${variant.img}" alt="${p.name} ${variant.label}" loading="lazy">
            ${total > 1 ? `<button class="nav-btn nav-next" onclick="changeVariant('${p.code}', 1, ${total})">›</button>` : ''}
            ${total > 1 ? `<div class="variant-badge">${variant.label} (${idx+1}/${total})</div>` : ''}
          </div>
          <div class="pbody">
            <div class="pcat">${p.category}</div>
            <div class="ptitle">${p.name}${total > 1 ? ' — ' + variant.label : ''}</div>
            <div class="pprice">${formatRupiah(p.price)}</div>
            <a class="btn" onclick="fbq('track','Lead')" href="${waLink(p.name, variant.label)}" target="_blank" rel="noopener">Chat &amp; Order</a>
          </div>
        </div>
      `;
      }).join('');
    }

    fetch('products.json')
      .then(res => res.json())
      .then(data => {
        allProducts = data;
        renderCategories();
        renderProducts();
      })
      .catch(err => {
        document.getElementById('productGrid').innerHTML = '<p style="padding:20px;color:#888;">Gagal memuat data produk.</p>';
        console.error(err);
      });

    document.getElementById('searchBox').addEventListener('input', renderProducts);
  </script>

</body>
</html>
